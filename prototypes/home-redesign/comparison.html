<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Biu 设计对照</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#08080a;color:#fff;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;width:1440px;height:1024px}
    section{min-width:0;display:flex;flex-direction:column;gap:8px} header{color:#aaa;font-size:12px;letter-spacing:.04em}
    .frame{flex:1;min-height:0;border:1px solid #303035;border-radius:10px;overflow:hidden;background:#111}
    img{width:100%;height:100%;object-fit:contain;display:block}
    iframe{width:1440px;height:1024px;border:0;transform:scale(.482);transform-origin:top left}
  </style>
</head>
<body>
  <main>
    <section><header>视觉目标 · 方案 2</header><div class="frame"><img src="assets/reference-option-2.png" alt="视觉目标" /></div></section>
    <section><header>HTML 实现 · 融合版</header><div class="frame"><iframe src="index.html" title="HTML 实现"></iframe></div></section>
  </main>
</body>
</html>
