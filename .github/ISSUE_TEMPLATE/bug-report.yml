name: 🐛 Bug 反馈 (Bug Report)
description: 提交一个 Bug 报告帮助我们改进
labels: ["🐛bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您反馈 Bug！请填写以下表单。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 您当前使用的版本号是多少？
      placeholder: v2.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10/11
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 问题描述
      description: |
        请描述该问题并附带问题截图，方便我们定位问题并排查。
        可选择附上应用日志文件，以便快速定位问题。
        默认日志位置：
        - Windows: C:/Users/<用户名>/AppData/Roaming/lili/logs/main.log 或 renderer.log
        - macOS: ~/Library/Application Support/lili/logs/main.log 或 renderer.log
        - Linux: ~/.config/lili/logs/main.log 或 renderer.log
        您可以直接将日志文件拖拽到下方的输入框中上传。
      placeholder: 详细问题描述...
    validations:
      required: true
